name: OMEGA build verification
on:
  push:
    branches: ['omega/verified-enquiry-001']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: omega-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/enquiry.test.mjs
      - run: npm run build
      - run: test -s dist/index.html && test -s dist/enquire/index.html
